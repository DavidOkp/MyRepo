<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deda Hospital</title>
    <link rel="stylesheet" href="style.css">
    <!-- <link rel="stylesheet" href="path/to/font-awesome/css/font-awesome.min.css"> -->
    <!-- <link rel="stylesheet" href="https://cloudflare.com"> -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="form-container">
      <div class="logo">
        <!-- <img src="C:\Users\HP\Desktop\EMR Front page remake\slazzer-preview-qddo9.png" class="logo-img"> -->
      </div>

      <div class="txt-container">
        <form class="form-fill">
          <div class="user-div" style="position: relative">
            <span style="position: absolute; top: 18px; right: 133px; height:35px; width: 30px; background-color: #ffffff; padding: 5px; display: flex; align-items: center; justify-content: center;">
              <i class="fa fa-user-o" aria-hidden="true" style="color: #000000"></i>
            </span>
            <label style="top: 10px; left: 10px;">Username</label>
            <input class="username" placeholder="Enter your username" id="user"/>
          </div> 

          <div class="pass-div" style="position: relative;">
            <span style="position: absolute; top: 18px; right: 133px; height:35px; width: 30px; background-color: #ffffff; padding: 5px; display: flex; align-items: center; justify-content: center;" >
              <i class="fa fa-eye" aria-hidden="true" style="color: #000000;" ></i>
            </span>
            <label >Password</label>
            <input class="password" placeholder="Enter your password" id="pass"/>
          </div>

          <div class="button-div">
            <button class="button">Log Me in</button>
          </div> 
        </form>
      </div>
    </div>
</body>
</html>
